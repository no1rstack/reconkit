[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reconkit"
version = "0.2.1"
description = "Evidence collection, provenance, and preservation utilities for authorized investigations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary Software License — Free Use, No Modification" }
authors = [{ name = "reconkit" }]
keywords = ["osint", "forensics", "scraping", "triage"]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "dnspython>=2.6",
  "python-whois>=0.9",
  "ipwhois>=1.2",
  "exifread>=3.0",
  "filetype>=1.2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
reconkit = "reconkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
